<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Фотопринт Контур</title><desc id="desc">Пульс, PicPac и Проявитель объединены в один процесс от заказа до качества.</desc>
<rect width="1280" height="420" rx="24" fill="#11151f"/>
<path d="M880 0v420M980 0v420M1080 0v420M1180 0v420" stroke="#202635"/>
<circle cx="1140" cy="95" r="112" fill="none" stroke="#ea9fa4" stroke-width="2"/>
<circle cx="1070" cy="164" r="112" fill="none" stroke="#b39adb" stroke-width="2"/>
<circle cx="1180" cy="185" r="112" fill="none" stroke="#f3b33d" stroke-width="2"/>
<text x="64" y="104" font-family="Arial,sans-serif" font-size="55" font-weight="700" fill="#f6f1e9">Фотопринт Контур</text>
<text x="66" y="158" font-family="Arial,sans-serif" font-size="25" fill="#c4c9d4">Три трека. Один процесс. Все в выигрыше.</text>
<path d="M200 282H1060" stroke="#465065" stroke-width="2"/>
<rect x="64" y="230" width="340" height="122" rx="14" fill="#1d2330"/>
<rect x="470" y="230" width="340" height="122" rx="14" fill="#1d2330"/>
<rect x="876" y="230" width="340" height="122" rx="14" fill="#1d2330"/>
<text x="88" y="278" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ea9fa4">PicPac</text>
<text x="88" y="318" font-family="Arial,sans-serif" font-size="19" fill="#e0e3e9">Клиент → проект → заказ</text>
<text x="494" y="278" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f3b33d">Пульс</text>
<text x="494" y="318" font-family="Arial,sans-serif" font-size="19" fill="#e0e3e9">Команда → исполнение</text>
<text x="900" y="278" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#b39adb">Проявитель</text>
<text x="900" y="318" font-family="Arial,sans-serif" font-size="19" fill="#e0e3e9">Контекст → качество → действие</text>
</svg>
