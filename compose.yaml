services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proyavitel
      POSTGRES_USER: proyavitel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_demo.py first}
    volumes:
      - assistant-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyavitel -d proyavitel"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./ai-service
    env_file: .env
    environment:
      AI_DATABASE_URL: postgresql+asyncpg://proyavitel:${POSTGRES_PASSWORD}@postgres:5432/proyavitel
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    env_file: .env
    environment:
      AI_DATABASE_URL: postgresql+asyncpg://proyavitel:${POSTGRES_PASSWORD}@postgres:5432/proyavitel
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  assistant-data:

