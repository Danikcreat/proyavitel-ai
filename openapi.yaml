components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    HTTPBearer:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Ошибка (RFC 7807)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              traceId:
                type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        departmentScope:
          type: array
          items:
            type: string
          description: id подразделений или ["*"]
        permissions:
          type: array
          items:
            type: string
    Role:
      type: string
      enum:
      - director
      - department_head
      - analyst
      - hr
      - marketing
      - support_operator
      - moderator
      - production_worker
      - employee
      - client
    TrafficLight:
      type: string
      enum:
      - green
      - yellow
      - red
    Channel:
      type: string
      enum:
      - telegram
      - email
      - web_chat
      - mobile_app
      - site
    SupportTopic:
      type: string
      enum:
      - defect
      - client_error
      - sample_question
      - delivery_question
      - other
      description: брак / ошибка клиента / вопросы по образцу / вопросы по доставке
    OrderStatus:
      type: string
      enum:
      - accepted
      - moderation
      - printing
      - post_processing
      - assembly
      - ready
      - in_delivery
      - completed
      - cancelled
      - rejected
    DecisionStatus:
      type: string
      enum:
      - new
      - in_progress
      - done
      - verified
      - failed
    RejectReason:
      type: string
      enum:
      - low_resolution
      - empty_areas
      - unsupported_format
      - content_policy
      - other
    TaskSource:
      type: string
      enum:
      - user
      - decision
      - meeting
      - assistant
    BreakdownDimension:
      type: string
      enum:
      - day
      - week
      - department
      - product
      - channel
      - station
      - shift
      - campaign
      - cause
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        segment:
          type: string
          enum:
          - new
          - active
          - repeat
          - churn_risk
          - churned
        channel:
          $ref: '#/components/schemas/Channel'
        firstOrderAtUtc:
          type: string
          format: date-time
        ltv:
          type: number
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Фотокнига 20×20, 20 разворотов
        category:
          type: string
          example: photobook
        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              priceByn:
                type: number
              photoRequirements:
                type: object
                properties:
                  minPixels:
                    type: integer
                    example: 1500000
                  formats:
                    type: array
                    items:
                      type: string
                    example:
                    - JPEG
                    - PNG
                  maxFileMb:
                    type: integer
        productionDays:
          type: integer
    Order:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        productId:
          type: string
        amountByn:
