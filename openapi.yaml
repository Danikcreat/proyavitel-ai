openapi: 3.0.3
info:
  title: Фотопринт Контур — API платформы «Пульс»
  version: 0.10.0
  description: "Единый REST-контракт платформы. Потребители: web-панель (трек 1),\n\
    мобильное приложение picPac (трек 2), AI-ассистент «Проявитель» (трек 3).\n\n\
    Соглашения:\n- Все времена — ISO 8601 UTC, отображение в Europe/Minsk (UTC+3).\n\
    - Деньги — BYN; финансовые демо-значения могут быть в условных единицах (units).\n\
    - Ошибки — RFC 7807 (application/problem+json): { title, status, detail, traceId\
    \ }.\n- Права проверяются на сервере; доступ мимо scope → 403 + запись в аудит.\n\
    - Идемпотентность: POST-запросы с Idempotency-Key при повторе возвращают\n  исходный\
    \ результат без побочных эффектов.\n- Живые обновления: SignalR-хаб /hubs/pulse\
    \ (события metric.updated,\n  order.created, order.status_changed, decision.due,\
    \ sla.at_risk, kpi.red).\n\nAI-сервис: маршруты conversations проксируются на\
    \ localhost:8081. /assistant/chat заменён.\n"
servers:
- url: http://localhost:8080
  description: Локальная разработка
security:
- bearerAuth: []
tags:
- name: Auth
  description: Аутентификация и профиль
- name: Metrics
  description: Пульс компании, KPI, drill-down, прогноз
- name: Decisions
  description: Реестр решений и проверка эффекта
- name: Sales
  description: Клиенты и воронка
- name: Support
  description: Инбокс поддержки и SLA
- name: Production
  description: Производство, качество, канбан
- name: Moderation
  description: Очередь модерации проектов picPac
- name: Tasks
  description: Задачник
- name: Marketing
  description: Кампании
- name: Equipment
  description: Станки и материалы
- name: Hr
  description: 'TeamBoard: люди, нагрузка, отсутствие'
- name: Recruiting
  description: Рекрутинг-воронка
- name: Finance
  description: 'P&L: план/факт и маржа'
- name: Kb
  description: База знаний
- name: Approvals
  description: Согласования
- name: DataQuality
  description: Качество данных и DataFactory
- name: Catalog
  description: Каталог picPac (трек 2)
- name: Orders
  description: Заказы и статусы (трек 2)
- name: Assistant
  description: AI-ассистент (трек 3)
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Вход (логин+пароль, выдача JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              properties:
                login:
                  type: string
                  example: director
                password:
                  type: string
                  example: demo1234
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAtUtc:
                    type: string
                    format: date-time
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags:
      - Auth
      summary: Текущий профиль (роль, пермишены, department_scope)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /metrics/pulse:
    get:
      tags:
      - Metrics
      summary: Пульс компании — все KPI с планом/фактом/прогнозом и статусом
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: department
        in: query
        schema:
          type: string
        description: id подразделения; пусто = доступный scope
      - name: product
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                  filters:
                    type: object
                  kpis:
                    type: array
                    items:
                      $ref: '#/components/schemas/KpiStatus'
                  criticalAlerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
  /metrics/{code}:
    get:
      tags:
      - Metrics
      summary: Стеклянная метрика — паспорт KPI (формула, источник, время обновления)
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        example: defect_rate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
  /metrics/{code}/breakdown:
    get:
      tags:
      - Metrics
      summary: Drill-down метрики по измерению (до причины)
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: by
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/BreakdownDimension'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: department
        in: query
        schema:
          type: string
      - name: product
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: напр. "Станок №3" или "2026-W45"
                        value:
                          type: number
                        plan:
                          type: number
                        status:
                          $ref: '#/components/schemas/TrafficLight'
                        drillTo:
                          type: string
                          description: ссылка/тип сущности для следующего уровня
  /forecast/demand-vs-capacity:
    get:
      tags:
      - Metrics
      summary: Прогноз спроса и мощности на 4+ недели с неделей дефицита
      parameters:
      - name: weeks
        in: query
        schema:
          type: integer
          default: 4
      - name: department
        in: query
        schema:
          type: string
      - name: whatIfDemandDelta
        in: query
        schema:
          type: number
          description: 'Что-если: сдвиг спроса, напр. 0.15 = +15%'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForecastPoint'
                  deficitWeeks:
                    type: array
                    items:
                      type: string
                      format: date
                  method:
                    type: string
                    description: сезонность + тренд + скользящее среднее
  /decisions:
    get:
      tags:
      - Decisions
      summary: Реестр решений (фильтры)
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/DecisionStatus'
      - name: priority
        in: query
        schema:
          type: integer
      - name: department
        in: query
        schema:
          type: string
      - name: ownerId
        in: query
        schema:
          type: string
      - name: overdue
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionList'
    post:
      tags:
      - Decisions
      summary: Создать карточку решения (в т.ч. из красного KPI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCreate'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
  /decisions/{id}:
    patch:
      tags:
      - Decisions
      summary: Изменить решение (каждое изменение — в журнал)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
  /decisions/{id}/verify:
    post:
      tags:
      - Decisions
      summary: Повторная проверка — сравнение KPI до/после дедлайна
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionVerifyResult'
  /decisions/{id}/history:
    get:
      tags:
      - Decisions
      summary: История изменений решения (аудит)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
  /sales/funnel:
    get:
      tags:
      - Sales
      summary: Воронка продаж по каналам
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: channel
        in: query
        schema:
          $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        stage:
                          type: string
                          example: lead
                        count:
                          type: integer
                        conversionToNext:
                          type: number
  /sales/channels:
    get:
      tags:
      - Sales
      summary: 'Каналы: лиды, заказы, средний чек'
      responses:
        '200':
          description: OK
  /customers/{id}:
    get:
      tags:
      - Sales
      summary: Карточка клиента с историей заказов и обращений
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  interactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Interaction'
  /support/inbox:
    get:
      tags:
      - Support
      summary: Инбокс обращений (очередь с приоритизацией по SLA-риску)
      parameters:
      - name: channel
        in: query
        schema:
          $ref: '#/components/schemas/Channel'
      - name: topic
        in: query
        schema:
          $ref: '#/components/schemas/SupportTopic'
      - name: assigneeId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interaction'
  /support/tickets/{id}:
    get:
      tags:
      - Support
      summary: Обращение с перепиской и контекстом клиента
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /support/tickets/{id}/reply:
    post:
      tags:
      - Support
      summary: Ответ (текст или отправка черновика ассистента)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                assistantDraftId:
                  type: string
      responses:
        '200':
          description: OK
  /support/tickets/{id}/resolve:
    post:
      tags:
      - Support
      summary: Закрыть обращение (с причиной/результатом)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  type: string
                inSla:
                  type: boolean
      responses:
        '200':
          description: OK
  /support/sla:
    get:
      tags:
      - Support
      summary: SLA-панель по темам и каналам
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  byTopic:
                    type: array
                    items:
                      type: object
                      properties:
                        topic:
                          $ref: '#/components/schemas/SupportTopic'
                        slaPercent:
                          type: number
                        avgFirstReplyMin:
                          type: number
                        status:
                          $ref: '#/components/schemas/TrafficLight'
  /production/queue:
    get:
      tags:
      - Production
      summary: Очередь производства (этапы, возраст, станки)
      responses:
        '200':
          description: OK
  /production/load:
    get:
      tags:
      - Production
      summary: Загрузка линий/станков по сменам
      responses:
        '200':
          description: OK
  /production/orders/{orderId}/advance:
    post:
      tags:
      - Production
      summary: Перевести заказ на следующий этап (оператор линии)
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                toStatus:
                  $ref: '#/components/schemas/OrderStatus'
                stationId:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEvent'
  /production/defects:
    post:
      tags:
      - Production
      summary: Зарегистрировать брак (станция, смена, причина)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Defect'
      responses:
        '201':
          description: Создано
    get:
      tags:
      - Production
      summary: 'Брак: по причинам/станкам/сменам за период'
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
  /moderation/queue:
    get:
      tags:
      - Moderation
      summary: Очередь модерации проектов picPac (превью + возраст)
      responses:
        '200':
          description: OK
  /moderation/{orderId}/verdict:
    post:
      tags:
      - Moderation
      summary: Вердикт по проекту (принять/отклонить с причиной)
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - verdict
              properties:
                verdict:
                  type: string
                  enum:
                  - approved
                  - rejected
                reason:
                  $ref: '#/components/schemas/RejectReason'
                comment:
                  type: string
      responses:
        '200':
          description: OK
  /tasks:
    get:
      tags:
      - Tasks
      summary: Задачи (свои/по фильтру, с источником)
      parameters:
      - name: assigneeId
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          $ref: '#/components/schemas/TaskSource'
      - name: overdue
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags:
      - Tasks
      summary: Создать задачу (в т.ч. ассистентом — через proposal)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Создано
  /tasks/{id}:
    patch:
      tags:
      - Tasks
      summary: Изменить задачу (статус, срок)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /marketing/campaigns:
    get:
      tags:
      - Marketing
      summary: Кампании (статус, канал, бюджет, окно)
      responses:
        '200':
          description: OK
    post:
      tags:
      - Marketing
      summary: Запустить кампанию (напр. из сезонного прогноза)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                channel:
                  $ref: '#/components/schemas/Channel'
                budget:
                  type: number
                windowFrom:
                  type: string
                  format: date
                windowTo:
                  type: string
                  format: date
      responses:
        '201':
          description: Создано
  /equipment/stations:
    get:
      tags:
      - Equipment
      summary: 'Станки: состояние, загрузка, брак, ТО'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
  /equipment/{id}/maintenance:
    post:
      tags:
      - Equipment
      summary: Запланировать/провести ТО станка
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /materials/stock:
    get:
      tags:
      - Equipment
      summary: Остатки материалов с порогами заказа
      responses:
        '200':
          description: OK
  /materials/order:
    post:
      tags:
      - Equipment
      summary: Заказать материалы (из порога или решения)
      responses:
        '201':
          description: Создано
  /hr/headcount:
    get:
      tags:
      - Hr
      summary: Штат vs план по отделам (обеспеченность)
      responses:
        '200':
          description: OK
  /hr/load:
    get:
      tags:
      - Hr
      summary: Нагрузка сотрудников (heat-map по неделям)
      responses:
        '200':
          description: OK
  /hr/absence:
    get:
      tags:
      - Hr
      summary: Отсутствия (вход прогноза мощности)
      responses:
        '200':
          description: OK
  /hr/employees/{id}:
    get:
      tags:
      - Hr
      summary: Карточка сотрудника (KPI, review, нагрузка; обезличено по роли)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /recruiting/vacancies:
    get:
      tags:
      - Recruiting
      summary: Вакансии со прогнозом закрытия (из конверсии воронки)
      responses:
        '200':
          description: OK
  /recruiting/board:
    get:
      tags:
      - Recruiting
      summary: Канбан кандидатов по этапам
      responses:
        '200':
          description: OK
  /recruiting/candidates/{id}/advance:
    post:
      tags:
      - Recruiting
      summary: Перевести кандидата на следующий этап
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /finance/budget:
    get:
      tags:
      - Finance
      summary: БДР/БДДС план-факт по статьям и отделам
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: department
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
  /finance/unit-economics:
    get:
      tags:
      - Finance
      summary: Маржинальность по продуктам/клиентам/каналам
      parameters:
      - name: by
        in: query
        required: true
        schema:
          type: string
          enum:
          - product
          - customer
          - channel
      responses:
        '200':
          description: OK
  /finance/reconciliation:
    get:
      tags:
      - Finance
      summary: Сверка финансовых итогов (для экрана качества данных)
      responses:
        '200':
          description: OK
  /kb/search:
    get:
      tags:
      - Kb
      summary: Поиск по базе знаний (учитывает ACL текущего пользователя)
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: ai
        in: query
        schema:
          type: boolean
          default: false
        description: AI-режим с цитатами
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    document:
                      $ref: '#/components/schemas/Document'
                    fragment:
                      type: string
                    score:
                      type: number
  /kb/articles/{id}:
    get:
      tags:
      - Kb
      summary: Статья целиком (версия, дата актуальности)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Problem'
  /approvals:
    get:
      tags:
      - Approvals
      summary: Согласования (входящие/исходящие)
      parameters:
      - name: inbox
        in: query
        schema:
          type: boolean
      responses:
        '200':
