name: AI service
on: [push, pull_request]

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --project ai-service --python 3.12 --extra dev --frozen
      - run: python3 scripts/init_demo.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: uv run --project ai-service python scripts/smoke_demo.py
      - if: always()
        run: docker compose down --volumes
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: proyavitel_test
          POSTGRES_USER: proyavitel
          POSTGRES_PASSWORD: ci-local-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proyavitel -d proyavitel_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --project ai-service --python 3.12 --extra dev --frozen
      - run: uv run --project ai-service ruff check ai-service scripts
      - run: uv run --project ai-service ruff format --check ai-service scripts
      - run: node --test ai-service/tests/ui/*.test.mjs
      - run: node --test clients/javascript/*.test.mjs
      - run: uv run --project ai-service pytest ai-service/tests -q
      - run: uv run --project ai-service pytest ai-service/tests -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://proyavitel:ci-local-password@localhost:5432/proyavitel_test
      - run: uv run --project ai-service python scripts/export_openapi.py
      - run: git diff --exit-code -- openapi.yaml docs/assistant.openapi.json

